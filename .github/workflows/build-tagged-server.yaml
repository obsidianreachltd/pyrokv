name: Build Server
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'  # numeric SemVer tags

jobs:
  build:
    name: Build and Tag PyroKV Server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # <-- required for workload identity federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag format (SemVer)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF##*/}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag: $TAG"; exit 1; }

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/760210923437/locations/global/workloadIdentityPools/automation-pool/providers/github-provider'
          service_account: 'github-service-account@pyrokv.iam.gserviceaccount.com'

      - name: Docker login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t us-central1-docker.pkg.dev/pyrokv/pyrokv/pyrokv-server:${IMAGE_TAG} \
                       -t us-central1-docker.pkg.dev/pyrokv/pyrokv/pyrokv-server:${GITHUB_REF##*/} \
                       -t us-central1-docker.pkg.dev/pyrokv/pyrokv/pyrokv-server:latest \
                       -f crates/pyrokv-server/Dockerfile .

      - name: Push Docker Image
        run: |
          docker push us-central1-docker.pkg.dev/pyrokv/pyrokv/pyrokv-server --all-tags
